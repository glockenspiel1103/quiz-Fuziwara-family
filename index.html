<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>クイズ！藤原氏‼</title>

    <style>

        body { font-family: sans-serif; text-align: center; background-color: #fdf6f0; padding: 20px; }

        .container { max-width: 600px; margin: auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        button { display: block; width: 100%; margin: 10px 0; padding: 15px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; background-color: #fff; font-size: 16px; }

        button:hover { background-color: #e8e0d5; }

        ul { text-align: left; display: inline-block; margin: 15px 0; }

        h1 { color: #5d4037; }

        .message { color: #d32f2f; font-weight: bold; margin: 10px 0; }

    </style>

</head>

<body>

    <div class="container">

        <h1>クイズ！藤原氏！！</h1>

        <div id="quiz-box"></div>

    </div>



    <script>

        const masterData = [

            {"id": 1, "name": "藤原鎌足", "birth_year": 614, "death_year": 669, "achievements": "大化の改新で中大兄皇子を補佐し、藤原氏の祖となる。"},

            {"id": 2, "name": "藤原不比等", "birth_year": 659, "death_year": 720, "achievements": "大宝律令の制定に尽力し、藤原氏の政治上の地位を確立。"},

            {"id": 3, "name": "藤原武智麻呂", "birth_year": 680, "death_year": 737, "achievements": "藤原南家の祖。"},

            {"id": 4, "name": "藤原房前", "birth_year": 681, "death_year": 737, "achievements": "藤原北家の祖。"},

            {"id": 5, "name": "藤原宇合", "birth_year": 694, "death_year": 737, "achievements": "藤原式家の祖。"},

            {"id": 6, "name": "藤原麻呂", "birth_year": 695, "death_year": 737, "achievements": "藤原京家の祖。"},

            {"id": 7, "name": "藤原百川", "birth_year": 732, "death_year": 779, "achievements": "式家。光仁天皇・桓武天皇を擁立し、政権の交代を主導。"},

            {"id": 8, "name": "藤原広嗣", "birth_year": 715, "death_year": 740, "achievements": "藤原式家。九州で大規模な反乱を起こした。"},

            {"id": 9, "name": "藤原仲麻呂", "birth_year": 706, "death_year": 764, "achievements": "恵美押勝とも呼ばれる。初めて皇族以外で太政大臣になるなど権勢を振るったが道鏡が権力を握ると反乱を起こした。"},

            {"id": 10, "name": "藤原種継", "birth_year": 737, "death_year": 785, "achievements": "桓武天皇の信任を受け長岡京遷都を推進したが暗殺された。"},

            {"id": 11, "name": "藤原仲成", "birth_year": 745, "death_year": 810, "achievements": "父の種継の死により若くして権力を握ったが人望の無さから権威を失墜。妹の薬子と反乱を起こし処刑された。"},

            {"id": 12, "name": "藤原緒嗣", "birth_year": 774, "death_year": 843, "achievements": "嵯峨天皇に重用され、軍事・造作の停止を論じる徳政相論を説いた。"},

            {"id": 13, "name": "藤原冬嗣", "birth_year": 775, "death_year": 826, "achievements": "嵯峨天皇等に重用され、北家の勢力を拡大。蔵人頭を設置し権力を固めた。"},

            {"id": 14, "name": "藤原良房", "birth_year": 804, "death_year": 872, "achievements": "皇族以外で初めて摂政に就任した。"},

            {"id": 15, "name": "藤原基経", "birth_year": 836, "death_year": 891, "achievements": "日本で最初に関白に就任した。宇多天皇と対立した阿衡の紛議を起こした。"},

            {"id": 16, "name": "藤原時平", "birth_year": 871, "death_year": 909, "achievements": "菅原道真を失脚させた昌泰の変の首謀者。"},

            {"id": 17, "name": "藤原純友", "birth_year": 887, "death_year": 941, "achievements": "瀬戸内海で大規模な海賊行為を展開し、天慶の乱を起こした。"},

            {"id": 18, "name": "藤原秀郷", "birth_year": 891, "death_year": 940, "achievements": "平将門を討伐した武勇で知られる。"},

          　 {"id": 20, "name": "藤原兼家", "birth_year": 929, "death_year": 990, "achievements": "道長の父。摂関政治の全盛期を築いた。"},

            {"id": 21, "name": "藤原佐理", "birth_year": 944, "death_year": 998, "achievements": "三蹟の一人。能書家として名高い。"},

            {"id": 22, "name": "藤原伊周", "birth_year": 974, "death_year": 1010, "achievements": "道長のライバル。長徳の変で失脚した。"},

            {"id": 23, "name": "藤原隆家", "birth_year": 979, "death_year": 1044, "achievements": "刀伊の入寇で活躍し、九州沿岸に攻めてきた新羅等の海賊を撃退した。"},

            {"id": 24, "name": "藤原道長", "birth_year": 966, "death_year": 1028, "achievements": "摂関政治の全盛期を導く。この世をば…の「望月の歌」が有名。"},

            {"id": 25, "name": "藤原頼通", "birth_year": 992, "death_year": 1074, "achievements": "平等院鳳凰堂を建立した。"},

            {"id": 26, "name": "藤原通憲", "birth_year": 1106, "death_year": 1159, "achievements": "信西とも呼ばれる。後白河院の近臣として保元の新制を推進したが恨みを買い、平治の乱で源氏の武士に殺された。"},

            {"id": 27, "name": "藤原忠通", "birth_year": 1097, "death_year": 1164, "achievements": "保元の乱の際、父の忠実と対立し、後白河天皇側につく。"},

            {"id": 28, "name": "藤原頼長", "birth_year": 1120, "death_year": 1156, "achievements": "その激烈な性格から「悪左府」と恐れられた。保元の乱で崇徳上皇側につき敗死した。"},

            {"id": 29, "name": "藤原清衡", "birth_year": 1056, "death_year": 1128, "achievements": "奥州藤原氏の初代。平泉を拠点に繁栄を築く。"},

            {"id": 30, "name": "藤原基衡", "birth_year": 1105, "death_year": 1157, "achievements": "奥州藤原氏の二代。中尊寺金色堂の建設に関与した。"},

            {"id": 31, "name": "藤原秀衡", "birth_year": 1122, "death_year": 1187, "achievements": "奥州藤原氏の三代。義経を保護した。"},

            {"id": 32, "name": "藤原泰衡", "birth_year": 1155, "death_year": 1189, "achievements": "奥州藤原氏の四代。源義経を自害に追い込み、源頼朝により滅ぼされた。"},

            {"id": 33, "name": "藤原定家", "birth_year": 1162, "death_year": 1241, "achievements": "歌人。『新古今和歌集』の選者、『小倉百人一首』の編者。"},

            {"id": 34, "name": "藤原信実", "birth_year": 1176, "death_year": 1265, "achievements": "似絵の達人。後鳥羽院ら公卿の肖像画を数多く残した。"},

            {"id": 35, "name": "藤原頼経", "birth_year": 1218, "death_year": 1256, "achievements": "鎌倉幕府第4代将軍。"},

            {"id": 36, "name": "藤原頼嗣", "birth_year": 1239, "death_year": 1256, "achievements": "鎌倉幕府第5代将軍。"},

            {"id": 37, "name": "藤原惺窩", "birth_year": 1561, "death_year": 1619, "achievements": "江戸時代の朱子学の祖。冷泉家から分かれた儒学者。"}

        ];



        function getEra(birth, death) {

            const getPeriod = (year) => {

                if (year <= 710) return "飛鳥";

                if (year <= 794) return "奈良";

                if (year <= 1185) return "平安";

                if (year <= 1338) return "鎌倉";

                if (year <= 1603) return "室町";

                return "江戸";

            };

            let start = getPeriod(birth);

            let end = getPeriod(death);

            return (start === end) ? start + "時代" : start + "～" + end + "時代";

        }



        let currentLevel = 0;

        let currentSample = [];

        let errorMessage = "";



        function showMenu() {

            errorMessage = "";

            document.getElementById('quiz-box').innerHTML = `

                <h2>レベルを選択</h2>

                <button onclick="startQuiz(1)">レベル1：どの藤原さんの仕業？</button>

                <button onclick="startQuiz(2)">レベル2：あなた何した藤原さん？</button>

                <button onclick="startQuiz(3)">レベル3：※難易度高　生年順に並び替え！</button>

            `;

        }



        function startQuiz(level) {

            currentLevel = level;

            errorMessage = "";

            if (level === 3) currentSample = [...masterData].sort(() => 0.5 - Math.random()).slice(0, 4);

            renderQuiz();

        }



        function renderQuiz() {

            const quizBox = document.getElementById('quiz-box');

            quizBox.innerHTML = `<button onclick="showMenu()">← メニューに戻る</button>`;

            if (errorMessage) quizBox.innerHTML += `<div class="message">${errorMessage}</div>`;



            if (currentLevel === 3) {

                let sorted = [...currentSample].sort((a, b) => a.birth_year - b.birth_year);

                let userChoices = [];

                quizBox.innerHTML += `<h3>生年が早い順に4名をクリック！</h3>`;

                currentSample.forEach(p => {

                    let btn = document.createElement("button");

                    btn.innerText = p.name;

                    btn.onclick = function() {

                        userChoices.push(p);

                        this.disabled = true;

                        this.style.backgroundColor = "#ddd";

                        if (userChoices.length === 4) {

                            if (userChoices.every((v, i) => v.id === sorted[i].id)) {

                                let listHtml = sorted.map(i => `<li>${i.name}：${i.birth_year}年 (${getEra(i.birth_year, i.death_year)})</li>`).join('');

                                quizBox.innerHTML = `<h3>正解！</h3><ul>${listHtml}</ul><button onclick="startQuiz(3)">次の問題へ</button><button onclick="showMenu()">メニューに戻る</button>`;

                            } else {

                                errorMessage = "残念！順番が違います。再挑戦！";

                                renderQuiz();

                            }

                        }

                    };

                    quizBox.appendChild(btn);

                });

            } else {

                const correct = masterData[Math.floor(Math.random() * masterData.length)];

                let choices = masterData.filter(p => p.id !== correct.id).sort(() => 0.5 - Math.random()).slice(0, 3);

                choices.push(correct);

                choices.sort(() => 0.5 - Math.random());

                quizBox.innerHTML += `<h3>${currentLevel === 1 ? '誰の説明？：' + correct.achievements : '名前：' + correct.name}</h3>`;

                choices.forEach(c => {

                    quizBox.innerHTML += `<button onclick="checkAnswer(${c.id}, ${correct.id})">${(currentLevel === 1 ? c.name : c.achievements)}</button>`;

                });

            }

        }



        function checkAnswer(s, c) {

            if (s === c) {

                const p = masterData.find(x => x.id === c);

                document.getElementById('quiz-box').innerHTML = `

                    <h3>正解！</h3>

                    <p><strong>${p.name}</strong><br>期間: ${p.birth_year}～${p.death_year} (${getEra(p.birth_year, p.death_year)})</p>

                    <button onclick="renderQuiz()">次へ</button>

                    <button onclick="showMenu()">メニューに戻る</button>

                `;

            } else {

                errorMessage = "残念！もう一度。";

                renderQuiz();

            }

        }

        showMenu();

    </script>

</body>

</html>
